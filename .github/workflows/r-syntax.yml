name: R syntax

on:
  push:
    branches: [chore/manuscript-ui-release]
  pull_request:

jobs:
  parse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - name: Parse Shiny sources
        run: Rscript -e 'for (file in c("app.R", "ui.R", "server.R", "global.R")) { parse(file = file); cat("Parsed:", file, "\n") }'
